.max(...state.visited,1);return `<button class="nav-item ${active?'active':''} ${done?'completed':''}" data-action="navigate" data-value="step${k}" title="Step ${k} — ${esc(n)}"><span class="step-circle">${done&&!active?ic('check',13):String(k).padStart(2,'0')}</span><span class="nav-label">${esc(n)}</span></button>`}).join('');let labs=LABS.map(([id,l,icon])=>`<button class="side-lab ${cur===id?'active':''}" data-action="navigate" data-value="${id}" title="${l}">${ic(icon,18)}<span class="lab-text">${l}</span></button>`).join('');let html=`<header class="top"><button class="v5-mobile-toggle" data-action="v5-mobile-menu" aria-label="Open navigation menu">${ic('list',20)}</button><div class="brand"><span class="logo"><span></span><span></span><span></span></span><strong>AIASO / MRO</strong><i class="head-sep"></i><small>AI Risk Oversight & Strategy</small><i class="head-sep"></i><span class="head-title">${esc(label)}</span></div><div class="top-actions"><button class="head-search" data-action="command">${ic('search',16)}<span>Search workflow</span><span class="keyhint">Ctrl + K</span></button><button class="head-icon" data-action="help" title="Help">${ic('help',19)}</button><button class="head-icon" data-action="export-project" title="Export project state">${ic('download',19)}</button><button class="avatar" title="Offline demo user">JD</button></div></header><div class="layout"><div class="mobile-scrim" data-action="v5-mobile-menu"></div><aside><div class="side-brand">${ic('layers',24)}<div><h2>MRO AI Risk Triaging</h2><p>Simulation, Replay & Analytical Evaluation Framework</p></div></div><div class="side-h">Simulation Workflow</div><div class="side-sub">10-step controlled process</div><nav class="nav-list">${nav}</nav><div class="side-section">Downstream Capabilities</div>${labs}<div class="side-section">Project Controls</div><button class="side-lab" data-action="export-project">${ic('save',17)}<span class="lab-text">Export Project State</span></button><button class="side-lab" data-action="import-project">${ic('upload',17)}<span class="lab-text">Import Project State</span></button><button class="side-lab" data-action="reset-project">${ic('refresh',17)}<span class="lab-text">Reset Demo Data</span></button><div class="side-bottom"><strong>OFFLINE / DEMO MODE</strong><br/>Fictional assessment data, mock LLM and scoring rules. Local browser only. No bank systems connected.</div></aside><main><div class="info-banner">${ic('info',22)}<div class="info-text">${esc(intro)}</div><div class="banner-tag">${ic('flag',15)} &nbsp; ${step?`Step ${String(step).padStart(2,'0')} / 10`:'Downstream POC'}<small>Illustrative • no live connections</small></div></div><div class="stat-grid">${step?kpisStep(step).join(''):labKpis(cur).join('')}</div><div id="page">${renderPage(cur)}</div>${renderBottom(step)}</main></div>${state.modal?renderModal():''}`;document.getElementById('root').innerHTML=html}
function labKpis(cur){if(cur==='analytics')return [stat('Evaluation Records',state.evaluations.length,'database'),stat('Questions',Q.length,'help'),stat('Data Sources',arrUnique(activeScenarios().map(s=>s.source)).length,'layers'),stat('Tool Status','Demo','checkcircle','Deterministic local calculations')];if(cur==='replay')return [stat('Baseline',esc(state.methodologyVersion),'layers'),stat('Candidate Q03 Weight',state.candidateWeight+'%','settings'),stat('High Risk Threshold',state.candidateThreshold,'flag'),stat('Replayable Cases',state.agentRuns.length,'database')];if(cur==='agent')return [stat('Approved Mock Tools',6,'settings'),stat('Connected LLM','None','bot'),stat('Dataset',state.evaluations.length+' records','database'),stat('Chat Turns',state.chat.length,'list')];return [stat('Handover Status','Draft','file'),stat('Selected Scenario',currentScenario()?.id||'None','database'),stat('IVT Scope','Independent','shield'),stat('Approval','Required','checkcircle') ]}
function renderBottom(step){return `<div class="demo-footer">${ic('layers',27)}<div class="foot-copy"><strong>${step?'All downstream steps use the same canonical Assessment Data Contract.':'Reusable MRO foundations — data, evaluation, analytics and tools.'}</strong><br/><span class="muted">This interactive prototype uses fictional examples and deterministic mock implementations. It does not validate the actual PwC/AIRO methodology or access Power Apps, MARM or an LLM.</span></div>${step&&step>1?b(ic('arrow',15)+' Previous','prev-step','sm ghost'):''}${step&&step<10?b('Next Step '+ic('arrow',15),'next-step','success'):''}</div><div class="footer-note">Browser-only proof of concept · Local demo state in this browser · Do not enter real customer or confidential bank data · Export project state to keep your working demo.</div>`}

function renderPage(cur){if(cur==='home')return renderHome();if(cur==='setup')return renderSetup();if(cur==='library')return renderLibrary();if(cur==='evaluateMode')return renderEvalMode();if(cur.startsWith('step')){let n=Number(cur.slice(4));return renderStepGuide(n)+STEPFNS[n-1]()}let f={analytics:renderAnalytics,replay:renderReplay,agent:renderDataAgent,knowledge:renderKnowledge}[cur];return f?datasetSelector()+f():''}

function renderStep1(){let qs=Q.filter(q=>{let t=(q.id+' '+q.dimension+' '+q.text).toLowerCase();return t.includes(state.qSearch.toLowerCase())});let pages=Math.max(1,Math.ceil(qs.length/8)),pn=Math.min(state.qPage,pages-1),items=qs.slice(pn*8,pn*8+8),selected=Q.find(q=>q.id===state.qSelected)||Q[0];let rows=items.map(q=>`<tr class="${q.id===selected.id?'selected':''}" data-row="${q.id}"><td><input type="checkbox" data-action="toggle-q" data-value="${q.id}" ${q.id===state.qSelected?'checked':''} aria-label="Select ${q.id}"/></td><td><strong>${q.id}</strong></td><td>${esc(q.dimension)}</td><td style="min-width:240px">${esc(q.text)}</td><td><div class="tag-cloud">${q.answers.slice(0,4).map(x=>pill(x,'dark')).join('')}</div></td><td>${pill(q.applicability,'blue')}</td><td>${pill(`W: ${q.weight.toFixed(2)}`,'dark')}</td><td>${pill(q.validated?'Validated':'Review',''+(q.validated?'ok':'warn'))}</td><td>${b(ic('eye',13),'select-q','sm',`data-value="${q.id}"`)}</td></tr>`).join('');return pageHead('Step 01 — Questionnaire & Rule Registry','A version-controlled technical representation of all questions, values, applicability rules and scoring mappings.',b(ic('upload',14)+' Import Registry','import-registry','sm')+b(ic('download',14)+' Export JSON','export-registry','sm')+b(ic('check',14)+' Validate','validate-registry','success sm'))+`<div class="grid2"><section class="card"><div class="card-header"><div class="left">${ic('table')}<strong>Question Registry</strong></div><div class="btn-group">${b(ic('plus',14)+' Add Question','add-question','sm')}${b('Publish Registry Version','publish-registry','success sm')}</div></div><div class="card-body"><div class="toolrow"><div class="filters"><input id="q-search" class="field" data-field="qSearch" value="${esc(state.qSearch)}" placeholder="Search ID, question or dimension"/>${pill('16 questionnaire dimensions','blue')}${pill('Fictional demo rule mappings','warn')}</div></div><div class="table-wrap"><table><thead><tr><th></th><th>Question</th><th>Risk Dimension</th><th>Question Text</th><th>Allowed Answers</th><th>Applicability</th><th>Scoring Mapping</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="9">No matches</td></tr>'}</tbody></table></div><div class="table-foot"><span>Showing ${items.length?pn*8+1:0}–${pn*8+items.length} of ${qs.length} questions</span><div class="btn-group">${b('‹','q-prev','sm',pn===0?'disabled':'')}${pill('Page '+(pn+1)+' / '+pages,'blue')}${b('›','q-next','sm',pn===pages-1?'disabled':'')}</div></div></div></section><div class="stack">${card('Selected Question Details',`<div class="split-head"><strong>${selected.id} — ${esc(selected.dimension)}</strong>${pill(selected.validated?'Validated':'Review Needed',selected.validated?'ok':'warn')}</div><dl class="details-dl"><dt>Question Text</dt><dd>${esc(selected.text)}</dd><dt>Allowed Answers</dt><dd><div class="tag-cloud">${selected.answers.map(x=>pill(x)).join('')}</div></dd><dt>Applicability</dt><dd>${esc(selected.applicability)}</dd><dt>Evidence Guidance</dt><dd>${esc(selected.evidence)}</dd><dt>Coverage Requirements</dt><dd>Every permitted value, applicable branch, unknown evidence and critical interactions</dd><dt>Rule Reference</dt><dd>${esc(selected.id==='Q03'?'DB-01 Autonomy + Tool Access':selected.id==='Q07'?'DB-02 Impact + Sensitive Data':'Standard weighted scoring')}</dd></dl><div class="btn-group" style="margin-top:12px">${b(ic('settings',14)+' Edit Question','edit-question','sm')}${b('Show Coverage','go-coverage','sm ghost')}</div>`,'file')}${card('Scoring & Rule Mapping',`<div class="mini-card"><strong>${selected.id} — ${esc(selected.dimension)}</strong>${bar('Weight contribution (illustrative)',Math.round(selected.weight*100))}<div class="tag-cloud">${pill('Scoring ref: '+state.methodologyVersion,'blue')}${pill('Threshold: 45 / 70','dark')}${selected.id==='Q03'||selected.id==='Q06'?pill('Deal-breaker linked','warn'):''}</div></div><p class="section-sub" style="margin-top:11px">DB-01: High autonomy AND external tool access → High risk floor.<br/>DB-02: High impact AND sensitive data → High risk floor.</p>`,'git')}${card('Validation & Change Control',`<div class="stack">${['Schema complete','Permitted answers defined','Rule mapping reviewed','AIRO business sign-off'].map((x,i)=>`<div class="split-head"><span style="font-size:11.5px">${ic(i<3?'checkcircle':'clock',16)} &nbsp; ${x}</span>${pill(i<3?'Demo checked':'Not real sign-off',i<3?'ok':'warn')}</div>`).join('')}</div><div class="rightnote">${note('All scoring weights, thresholds and deal-breakers displayed here are illustrative. Replace them with the approved AIRO specifications before any real engineering use.','warn')}</div>`,'shield')}</div></div>`}

function renderStep2(){let c=computedCoverage();let tiles=Q.map(q=>{let n=q.answers.filter(a=>c.covered[q.id].has(a)).length,r=pct(n,q.answers.length),k=r>=90?'good':r>=35?'medium':'low';return `<button class="matrix-cell ${k} ${state.coverageQuestion===q.id?'active':''}" data-action="coverage-q" data-value="${q.id}" title="${esc(q.dimension)}"><span>${q.id}</span><span class="mark">${n}/${q.answers.length} values</span></button>`}).join('');let q=Q.find(x=>x.id===state.coverageQuestion);let coverageDetails=q?`<div class="mini-card"><h4>${q.id} — ${esc(q.dimension)}</h4><p>Permitted values: ${q.answers.map(a=>`${pill(a,c.covered[q.id].has(a)?'ok':'warn')}`).join(' ')}</p><p style="margin-top:8px">Coverage excludes generated scenarios that have not passed scenario validation.</p></div>`:note('Select any question in the matrix to inspect its answer-value coverage.');let plan=state.coveragePlan.map((t,i)=>`<tr><td><strong>${esc(t.id)}</strong></td><td>${esc(t.target)}</td><td>${pill(t.type,'blue')}</td><td>${pill(t.priority,t.priority==='Critical'?'bad':t.priority==='High'?'warn':'dark')}</td><td>${pill(t.status,t.status==='Covered'?'ok':'warn')}</td><td>${b('Configure','target-to-scenario','sm',`data-value="${i}"`)}</td></tr>`).join('');return pageHead('Step 02 — Coverage Planner','Turn questionnaire, rules and gaps into an explicit, prioritised and testable coverage plan.',b(ic('refresh',14)+' Recalculate Coverage','recompute-coverage','sm')+b(ic('plus',14)+' Generate Coverage Plan','generate-plan','success sm'))+`<div class="grid2"><div class="stack">${card('16-Question Answer Coverage Heatmap',`<div class="matrix">${tiles}</div><div class="rightnote">${coverageDetails}</div><div class="rightnote">${bar('Validated answer-value coverage',pct(c.hit,c.total))}${bar('Questions with one or more cases',pct(c.questionCovered,16))}</div>`,'bar')}${card('Coverage Requirements & Test Requests',`<div class="toolrow"><div class="filters">${select('coveragePriority',[['critical','Critical first'],['all','All priorities'],['normal','Standard tests']],state.coveragePriority,'field field-sm')}<span class="small">The planner prioritises mandatory rules, evidence handling and boundary cases.</span></div>${b('Add Manual Target','add-target','sm')}</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Coverage Objective</th><th>Type</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody>${plan}</tbody></table></div>`,'list')}</div><div class="stack">${card('Coverage Dimensions',`<div class="stack">${bar('Question Coverage',pct(c.questionCovered,16))}${bar('Answer Value Coverage',pct(c.hit,c.total))}${bar('Mandatory Branches (illustrative)',60)}${bar('Evidence Behaviour',45)}${bar('Critical Pairwise Combinations',52)}</div><div class="divider"></div><div class="tag-cloud">${pill('Question / answer','blue')}${pill('Rule activation','warn')}${pill('Negative cases','dark')}${pill('Pairwise & 3-way','purple')}${pill('Thresholds','dark')}${pill('Missing evidence','bad')}</div>`,'chart')}${card('Coverage Planning Strategy',`<div class="process">${[['1','Check registry and conditional applicability'],['2','Inspect valid historical scenario coverage'],['3','Prioritise uncovered critical rules'],['4','Merge only feasible test requirements'],['5','Send target configurations to matching']].map(x=>`<div class="process-step"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="rightnote">${note('Question coverage is not a claim of classification accuracy. Pairwise coverage cannot replace explicit multi-factor deal-breaker tests.','warn')}</div>`,'flag')}</div></div>`}

function renderStep3(){let f=state.scenarioForm;let yaml=`scenario_id: PLAN-${String(activeScenarios().length+1).padStart(3,'0')}\narchetype: ${f.archetype}\ntarget_characteristics:\n  autonomy: ${f.autonomy.toLowerCase()}\n  customer_impact: ${f.impact.toLowerCase()}\n  sensitive_data: ${f.sensitive.toLowerCase()}\n  external_tool_access: ${f.tool.toLowerCase()}\n  customer_facing: ${f.customer}\ndocumentation:\n  completeness: ${f.documentation}\n  intentionally_missing: ${f.missing}\ndata_source_strategy:\n  preference: ${f.strategy}\ntest_objective: ${f.objective}`;return pageHead('Step 03 — Scenario Configuration','Configure the target scenario, hidden truth characteristics, evidence disclosure and historical-first selection strategy.',b(ic('save',14)+' Create Configuration','create-config','success sm')+b(ic('copy',14)+' Copy YAML','copy-yaml','sm'))+`<div class="grid2"><div class="stack">${card('Scenario Archetype & Target Risk Characteristics',`<div class="fgrid"><div class="fgroup"><label class="label">Business / AI Archetype</label>${select('archetype',ARCHETYPES,f.archetype)}</div><div class="fgroup"><label class="label">Autonomy Level</label>${select('autonomy',['Low','Medium','High'],f.autonomy)}</div><div class="fgroup"><label class="label">Potential Output Impact</label>${select('impact',['Low','Medium','High'],f.impact)}</div><div class="fgroup"><label class="label">Sensitive Data Processing</label>${select('sensitive',['Yes','No'],f.sensitive)}</div><div class="fgroup"><label class="label">External Tool Access</label>${select('tool',['Yes','No'],f.tool)}</div><div class="fgroup"><label class="label">Customer Exposure</label>${select('customer',[['true','Customer-facing'],['false','Internal only']],String(f.customer))}</div></div><div class="rightnote">${note('These are scenario design constraints, not the Agent’s answers. The tested Agent must not see hidden scenario truths.','warn')}</div>`,'settings')}${card('Evidence Disclosure & Test Objective', ally observe in the use case description and supporting documentation. An undisclosed fact must not become an asserted answer.</p></div><div class="rightnote">${note('Scenario configuration is deliberately smaller than the complete 16-question registry. The registry still defines coverage expectations for every question.')}</div>`,'layers')}${card('Scenario Configuration Inventory',`<div class="scroll-list">${activeScenarios().slice(-6).reverse().map(s=>`<div class="list-row"><div><strong>${esc(s.name)}</strong><small>${esc(s.id)} · ${esc(s.source)}</small></div>${b('Open','scenario-open','sm',`data-value="${s.id}"`)}</div>`).join('')}</div>`,'folder')}</div></div>`}

function matchHistory(){let f=state.scenarioForm;let all=HISTORY.concat(state.historyAdded);return all.map(h=>{let score=0;if(h.tech===(f.archetype.includes('agent')?'Agentic AI':f.archetype==='decision_support'?'Traditional ML':'GenAI'))score+=24;if(h.autonomy===f.autonomy)score+=25;if(h.tool===f.tool)score+=19;if(h.sensitive===f.sensitive)score+=15;if(h.impact===f.impact)score+=9;score+=Math.round((h.evidence||50)/100*8);return {...h,match:score}}).filter(h=>(h.name+' '+h.type+' '+h.id).toLowerCase().includes(state.matchSearch.toLowerCase())).sort((a,b)=>b.match-a.match)}
function renderStep4(){let sorted=matchHistory(),sel=sorted.find(h=>h.id===state.selectedHistory)||sorted[0],rank=sorted.map(h=>`<tr class="${sel?.id===h.id?'selected':''}"><td><strong>${esc(h.id)}</strong></td><td>${esc(h.name)}</td><td>${esc(h.tech)}</td><td>${pill(h.autonomy)}</td><td>${pill(h.tool==='Yes'?'Tools: Yes':'Tools: No',h.tool==='Yes'?'warn':'dark')}</td><td>${pill(h.evidence+'% evidence',h.evidence>=80?'ok':'warn')}</td><td><strong>${h.match}%</strong></td><td>${b('Select','select-history','sm',`data-value="${h.id}"`)}</td></tr>`).join('');return pageHead('Step 04 — Historical Case Retrieval & Matching','Prioritise evidence-supported historical-style cases based on scenario requirements, compatibility and incremental coverage.',b(ic('refresh',14)+' Run Matching','run-matching','primary sm')+b(ic('upload',14)+' Import Demo Cases','import-cases','sm'))+`<div class="grid2"><div class="stack">${card('Historical Scenario Library & Candidate Ranking',`<div class="toolrow"><div class="filters"><input class="field" id="match-search" value="${esc(state.matchSearch)}" placeholder="Search fictional historical cases"/>${pill('Historical-first','ok')}${pill('Fictional seed records','warn')}</div></div><div class="table-wrap"><table><thead><tr><th>Case ID</th><th>Use Case</th><th>Technology</th><th>Autonomy</th><th>Tools</th><th>Evidence</th><th>Match</th><th>Action</th></tr></thead><tbody>${rank||'<tr><td colspan="8">No cases found</td></tr>'}</tbody></table></div>`,'search')}${card('Matching Logic',`<div class="grid3"><div class="mini-card"><h4>1. Business fit</h4><p>Compare archetype and target risk characteristics.</p></div><div class="mini-card"><h4>2. Evidence support</h4><p>Check whether records substantiate the target values.</p></div><div class="mini-card"><h4>3. Coverage gain</h4><p>Prioritise cases that close the most outstanding test gaps.</p></div></div><div class="rightnote">${note('Scores shown are illustrative matching heuristics. Similarity is not function stagingRows(batchId=state.selectedBatchId){

  return scenarios.map(s=>{
    const evaluation=[...state.evaluations].reverse().find(e=>e.scenarioId===s.id);
    if(!evaluation)return null;
    const run=state.agentRuns.find(r=>r.id===evaluation.runId);
    const score=[...state.scoringRuns].reverse().find(z=>z.runId===evaluation.runId);
    return {assessment_id:s.id,scenario_id:s.id,source_type:s.source,
      batch_id:s.batchId||'ad_hoc',parent_reference_id:s.parent||null,
      questionnaire_version:state.registryVersion,methodology_version:state.methodologyVersion,
      score:score?.score??null,classification:score?.classification||null,
      scoring_status:score?.status||'Not scored',answer_agreement:evaluation.accuracy,
      review_status:s.reviewed?'illustrative_reference_flag':'not_expert_verified',
      evidence_status:(s.missing||[]).length?'partial':'complete',
      answers:{...(run?.answers||{})},evaluation_id:evaluation.id,agent_run_id:run?.id||null,
      verified_for_real_world_claims:false};
  }).filter(Boolean);
}

function computeReplay(){
 const records=datasetRows().filter(r=>r.answers&&Object.keys(r.answers).length);
 const rows=records.map(r=>{let baseline=scoreAnswers(r.answers,100,70),candidate=scoreAnswers(r.answers,state.candidateWeight,state.candidateThreshold);return {id:r.scenario_id,baseline,candidate,changed:baseline.classification!==candidate.classification,delta:(candidate.score??0)-(baseline.score??0)}});
 return {rows,changed:rows.filter(x=>x.changed).length,runs:rows.length,up:rows.filter(x=>x.delta>0).length,down:rows.filter(x=>x.delta<0).length};
}
function renderReplay(){let rp=state.replayResults||computeReplay();return pageHead('Historical Replay & Methodology Impact','Re-score fixed scenario answers under a candidate methodology. Offline what-if calculations never modify official risk classifications.',b(ic('refresh',14)+' Execute Replay','run-replay','success sm')+b('Export Comparison','export-replay','sm'))+`<div class="grid2"><div class="stack">${card('Baseline vs Candidate Configuration',`<div class="grid2 grid-even"><div class="mini-card"><h4>Baseline M_v1.0</h4><div class="formcheck">${ic('checkcircle',16)} Q03 Autonomy multiplier: 100%</div><div class="formcheck">${ic('checkcircle',16)} High threshold: 70</div><p>Frozen reference scoring (illustrative)</p></div><div class="mini-card"><h4>Candidate M_candidate</h4><div class="formcheck">${ic('settings',16)} Q03 multiplier: ${state.candidateWeight}%</div><div class="formcheck">${ic('settings',16)} High threshold: ${state.candidateThreshold}</div><p>Controlled analysis only — not approved</p></div></div><div class="divider"></div><div class="fgroup"><label class="label">Autonomy weighting multiplier: ${state.candidateWeight}%</label><input type="range" id="candidateWeight" min="50" max="200" step="5" value="${state.candidateWeight}" style="width:100%;accent-color:#0878d9"/></div><div class="fgroup"><label class="label">High-risk threshold: ${state.candidateThreshold}</label><input type="range" id="candidateThreshold" min="55" max="85" value="${state.candidateThreshold}" style="width:100%;accent-color:#008a5a"/></div>`,'settings')}${card('Case-Level Replay Comparison',`<div class="table-wrap"><table><thead><tr><th>Case</th><th>Baseline</th><th>Candidate</th><th>Score Δ</th><th>Classification Change</th></tr></thead><tbody>${rp.rows.map(x=>`<tr><td><strong>${esc(x.id)}</strong></td><td>${x.baseline.score} · ${pill(x.baseline.classification,'dark')}</td><td>${x.candidate.score} · ${pill(x.candidate.classification,x.changed?'warn':'dark')}</td><td>${x.delta>0?'+':''}${x.delta}</td><td>${pill(x.changed?'Changed':'Unchanged',x.changed?'warn':'ok')}</td></tr>`).join('')||'<tr><td colspan="5">No replayable records. Run Step 07 first.</td></tr>'}</tbody></table></div>`,'table')}</div><div class="stack">${card('Replay Impact Summary',`<div class="grid2 grid-even"><div class="mini-card"><h4>Replayable Cases</h4><div class="metric">${rp.runs}</div></div><div class="mini-card"><h4>Changed Classifications</h4><div class="metric">${rp.changed}</div></div><div class="mini-card"><h4>Score Increases</h4><div class="metric">${rp.up}</div></div><div class="mini-card"><h4>Score Decreases</h4><div class="metric">${rp.down}</div></div></div><div class="rightnote">${bar('Classification changes',pct(rp.changed,Math.max(1,rp.runs)))}${note('This illustrates deterministic scoring replay using saved simulated answers. Genuine historical replay additionally requires original assessment events, rule versions, eligible inputs and approved source snapshots.','warn')}</div>`,'chart')}${card('Replay Eligibility & Governance',`<div class="process">${[['1','Freeze assessment record and original source state'],['2','Check questionnaire semantics and version compatibility'],['3','Apply baseline and candidate methodologies separately'],['4','Explain exclusions, missing fields and overrides'],['5','Submit findings for AIRO methodology review']].map(([n,t])=>`<div class="process-step"><b>${n}</b><span>${t}</span></div>`).join('')}</div>`,'shield')}</div></div>`}

if(/weight|sensitivity|what.if|threshold|change|impact/.test(q)){let d=computeReplay();return {tool:'run_sensitivity_analysis',args:{baseline:'M_v1.0',candidate_weight_multiplier:state.candidateWeight,candidate_high_threshold:state.candidateThreshold},text:`Simulated what-if across ${d.runs} cases.\nBaseline: autonomy multiplier 100%, high-risk threshold 70.\nCandidate: autonomy multiplier ${state.candidateWeight}%, threshold ${state.candidateThreshold}.\nClassification changes: ${d.changed}.\nScore increases: ${d.up}; score decreases: ${d.down}.\n\nNo official methodology was changed. Results derive from local demo scoring rules.`}}
if(/distribution|autonomy|answers|question/.test(q)){let m=q.match(/q\s*0?(\d{1,2})/i);let id=m?'Q'+m[1].padStart(2,'0'):'Q03',field=Q.find(x=>x.id===id)||Q[2],counts={};rows.forEach(r=>{let v=r.answers[field.id]||'Missing';counts[v]=(counts[v]||0)+1});return {tool:'analyse_answer_distribution',args:{question_id:field.id,dataset_id:'mro_demo'},text:`${field.id} — ${field.dimension}, ${count} fictional assessments:\n${Object.entries(counts).map(([k,v])=>`• ${k}: ${v}`).join('\n')}\n\nThese frequencies are only for the fictional demonstration sample.`}}
if(/high risk|classification|score|breakdown|profile/.test(q)){let c={High:0,Medium:0,Low:0,'Requires Review':0};rows.forEach(r=>c[r.classification||'Requires Review']=(c[r.classification||'Requires Review']||0)+1);return {tool:'analyse_score_distribution',args:{dataset_id:'mro_demo'},text:`Illustrative classification distribution (${count} records):\n${Object.entries(c).map(([k,v])=>`${k}: ${v}`).join('\n')}\n\nClassifications use demonstration-only scoring mappings and should not be used for AIRO decisions.`}}
if(/replay|regression|compare/.test(q)){let d=computeReplay();return {tool:'compare_methodology_versions',args:{dataset_id:'mro_demo',baseline:'M_v1.0',candidate:'M_candidate'},text:`Replay compared ${d.runs} simulated assessment records. ${d.changed} classification(s) changed.\nUse the Historical Replay tab for case-level details and parameter adjustments.\n\nThis is a mock evaluation; no production data or rule was accessed.`}}

function dl(filename,text,type='application/json'){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded '+filename)}
function csvQuote(s){let t=String(s??'');return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function csv(data,keys){return [keys.join(','),...data.map(x=>keys.map(k=>csvQuote(x[k])).join(','))].join('\r\n')}
function parseCSV(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);let keys=rows.shift()||[];return rows.map(values=>Object.fromEntries(keys.map((k,i)=>[k.trim().replace(/^\uFEFF/,''),values[i]??''])))}

  }

}

  if(v.policy!=='synthetic_only'&&!state.didHistorySelection&&!state.selectedHistoricalIds.length){
    let eligible=buildHistoricalRanking().filter(x=>x.eligible);
    let limit=v.policy==='historical_only'?n:Math.min(n,Math.max(1,Math.floor(n*.4)));
    state.selectedHistoricalIds=eligible.slice(0,limit).map(x=>x.id);
  }
  const allHistory=HISTORY.concat(state.historyAdded);
  let selected=v.policy==='synthetic_only'?[]:(state.selectedHistoricalIds||[]).map(id=>allHistory.find(h=>h.id===id)).filter(Boolean).slice(0,n);
  let count=n-selected.length;
  const batchId='B-'+String(Date.now()%100000000).padStart(8,'0')+'-'+Math.floor(Math.random()*90+10);
  let created=[],scenarioIds=[];
  selected.forEach((h,i)=>{let obj=scenarioFromHistory(h);
    obj.id=batchId+'-H'+String(i+1).padStart(2,'0');obj.batchId=batchId;
    obj.status='draft';obj.validated=false;obj.reviewed=false;
    obj.source='historical';obj.sourceLabel='fictional historical-style reference';
    created.push(obj);scenarioIds.push(obj.id);
  });
  if(v.policy!=='historical_only'){
    let variantCount=Math.min(Math.floor(count*.45),selected.length?Math.max(1,selected.length):0);
    for(let i=0;i<count;i++){
      let form={...state.scenarioForm};
      // Controlled variation for coverage demonstration; all generated text is fictional.
      form.archetype=ARCHETYPES[(i+created.length)%ARCHETYPES.length][0];
      form.autonomy=(i%4===0?'Low':i%4===1?'Medium':'High');
      if(v.risk==='high')form.autonomy='High';if(v.risk==='low')form.autonomy='Low';
      form.tool=(i%3!==1?'Yes':'No');form.sensitive=(i%4!==1?'Yes':'No');
      form.impact=v.risk==='high'?'High':v.risk==='low'?'Low':['High','Medium','Low'][i%3];
      form.documentation=(i%4===0?v.documentation:['partial','complete','ambiguous','complete'][i%4]);

}

case 'validate-batch':{

    s.validationChecks={has_source:Boolean(s.source),has_document:Boolean(s.doc),has_scenario_truth:Boolean(s.truth),risk_characteristics_disclosed:evidenceCheck};
    if(!s.doc||!s.truth||!s.source||!evidenceCheck){s.validated=false;s.status='needs_review';continue}
    s.referenceAnswers={...refAnswers(s)};
    s.referenceFrozenAt=new Date().toISOString();
    s.referenceStatus='fictional_test_fixture_not_expert_approved';
    s.validated=true;s.status='validated';done++;

const _rawReferenceAnswers=refAnswers;
refAnswers=function(s){
  if(s.referenceAnswers&&typeof s.referenceAnswers==='object')return {...s.referenceAnswers};
  let result=_rawReferenceAnswers(s);
  if(s.source==='historical'){
    // Fictional historical-style descriptions do not document these control dimensions.
    for(let id of ['Q09','Q11','Q12','Q13','Q14','Q15','Q16'])result[id]='Unknown';
  }
  return result;
};

function v4TargetMet(target, scenarios){
 return scenarios.some(s=>{
  const a=refAnswers(s),doc=String(s.doc||'').toLowerCase();
  if(/^Q\d\d:/.test(target)){const [q,val]=target.split(':');return String(a[q]||'').toLowerCase()===String(val).toLowerCase()}
  if(target==='DB-01')return a.Q03==='High'&&a.Q06==='Yes';
  if(target==='DB-02')return a.Q07==='High'&&a.Q05==='Yes';
  if(target==='BOUNDARY'){const z=scoreAnswers(a);return z.score!==null&&Math.abs(z.score-70)<=5}
  if(/^high autonomy$/i.test(target.trim()))return a.Q03==='High';
  if(/^external tool access$/i.test(target.trim()))return a.Q06==='Yes';
  if(/^sensitive data$/i.test(target.trim()))return a.Q05==='Yes';
  if(/^missing regulatory applicability$/i.test(target.trim()))return a.Q08==='To be confirmed'||a.Q08==='Unknown';
  if(/high autonomy.*external tool/i.test(target))return a.Q03==='High'&&a.Q06==='Yes';
  if(/unknown human oversight.*high autonomy/i.test(target))return a.Q03==='High'&&a.Q04==='Unknown';
  if(/sensitive data.*high customer impact/i.test(target))return a.Q05==='Yes'&&a.Q07==='High'&&a.Q10==='Yes';
  if(/no external tools.*low autonomy/i.test(target))return a.Q03==='Low'&&a.Q06==='No';
  if(/ambiguous or contradictory/i.test(target))return /ambiguous|contradictory/.test(s.config?.documentation||s.doc||'');
  if(/score immediately below or above/i.test(target)){let z=scoreAnswers(a);return z.score!==null&&Math.abs(z.score-70)<=5}
  let m=target.match(/^(Q\d\d)\b[^:]*:\s*(.+)$/i);
  if(m){const expected=m[2].trim();return String(a[m[1]]||'').toLowerCase()===expected.toLowerCase()}
  return false;
 });

action=function(name,button){
 if(name==='v6-modal-start'){state.modal=null;go('step1');return;}
 if(name==='save-simulation-plan'){state.v6RequirementsSaved=true;}
 if(name==='v6-tab'){state.v6Step2Tab=button.dataset.value==='coverage'?'coverage':'requirements';save();refresh();return;}
 if(name==='v6-run-agent'){
  const ds=frozenDataset();if(!ds){toast('Gate 1 must freeze a Scenario Dataset before Agent execution.','bad');go('step6');return;}
  if(!ds.gate1?.eligibleForFreeze){toast('Selected dataset has no valid Gate 1 baseline.','bad');go('step6');return;}
  const version=state.evaluationAgentVersion||'MockAgent v0.4';const clean=version==='MockAgent v0.4';let rows=[];
  for(let i=0;i<ds.scenarios.length;i++){const s=CLONE(ds.scenarios[i]);const r=runAgentNow(s,!clean&&i%3===0);r.model=version;rows.push(CLONE(r));}
  state.v6AgentBatch={id:'AGB-'+Date.now().toString(36).toUpperCase(),scenarioDatasetId:ds.id,agentVersion:version,mode:state.executionMode||'verify',created:new Date().toLocaleString('en-GB'),runs:rows};
  state.v6ScoringBatch=null;state.v6ScoreCase=rows[0]?.scenarioId||'';markDone(7);save();go('step8');toast('Agent executed on '+rows.length+' fixed scenarios. Continue with scoring.');return;
 }
 if(name==='v6-run-scoring'){
  const ag=state.v6AgentBatch,ds=frozenDataset();if(!ag||ag.scenarioDatasetId!==ds?.id){toast('First run Step 07 on the selected fixed inputs.','bad');go('step7');return;}
  const runs=ag.runs.map(r=>{const s=ds.scenarios.find(x=>x.id===r.scenarioId);return runScoringNow(CLONE(s),r,100,state.v7HighThreshold||70)});
  state.v6ScoringBatch={id:'SCB-'+Date.now().toString(36).toUpperCase(),scenarioDatasetId:ds.id,agentBatchId:ag.id,scoringVersion:state.evaluationScoreVersion,runs:CLONE(runs)};
  state.v6ScoreCase=runs[0]?.scenarioId||'';markDone(8);save();go('step9');toast('Deterministic mock scoring completed for '+runs.length+' cases.');return;
 }
 if(name==='v6-run-gate2'){
  const ag=state.v6AgentBatch,sc=state.v6ScoringBatch,ds=frozenDataset();if(!ag||!sc||ag.scenarioDatasetId!==ds?.id||sc.agentBatchId!==ag.id){toast('Complete Agent and Scoring execution in Steps 07 and 08 first.','bad');return;}
  const results=[];
  for(let i=0;i<ag.runs.length;i++){
   const r=ag.runs[i],z=sc.runs.find(x=>x.runId===r.id),s=ds.scenarios.find(x=>x.id===r.scenarioId);if(!z||!s)continue;
   const ev=runEvaluationNow(CLONE(s),r,z);
   results.push({scenario_id:s.id,source_type:s.source,agent_run_id:r.id,scoring_run_id:z.id,evaluation_id:ev.id,score:z.score,classification:z.classification,scoring_status:z.status,agreement:ev.accuracy,scoring_pass:ev.scorePass,answers:CLONE(r.answers),expected:CLONE(refAnswers(s)),findings:CLONE(ev.findings),evidence_status:(s.missing||[]).length?'partial':'complete',execution_status:'completed'});
  }
  const session={id:'EVS-'+Date.now().toString(36).toUpperCase(),scenarioDatasetId:ds.id,batchId:ds.batchId,agentVersion:ag.agentVersion,scoringVersion:sc.scoringVersion,questionnaireVersion:ds.registryVersion,cases:results.length,meanAgreement:Math.round(results.reduce((a,x)=>a+x.agreement,0)/Math.max(1,results.length)),scoringPass:results.filter(x=>x.scoring_pass).length,created:new Date().toLocaleString('en-GB'),results:CLONE(results),evalIds:results.map(x=>x.evaluation_id)};
  state.evaluationSessions.push(session);state.selectedSessionId=session.id;state.selectedBatchId=ds.batchId;markDone(9);save();refresh();toast('Gate 2 evaluation completed. No coverage revalidation performed.');return;
 }
 if(name==='v5-freeze-scenarios'){
  const prevCount=state.scenarioDatasets.length;v6PrevAction(name,button);
  if(state.scenarioDatasets.length>prevCount){go('step7');}
  return;
 }
 if(name==='v5-run-frozen'){
  toast('Use Steps 07 → 08 → 09 for separate Agent, Scoring and Evaluation actions.','bad');go('step7');return;
 }
 return v6PrevAction(name,button);
};

 <div class="v7-engine-group"><div class="v7-engine-title"><span>PHASE C · PUBLISH & REUSE</span><small>Step 10 · Three linked data products</small></div><div class="v7-engine-grid">${boxes.slice(9).join('')}</div></div>
 <div class="grid2 grid-even" style="margin-top:16px">${card('Gate 1 · Coverage Gap',`<p class="section-sub">Insufficient valid scenarios or reference evidence. Return to planning, matching or synthetic generation, then freeze a NEW input version.</p>${b('View Gate 1','navigate','primary sm',`data-value="step6"`)}`,'layers')}${card('Gate 2 · Test Failure',`<p class="section-sub">A valid fixed scenario reveals an Agent, scoring or execution defect. Fix and selectively re-evaluate the SAME frozen inputs; do not generate new scenarios.</p>${b('View Gate 2','navigate','primary sm',`data-value="step9"`)}`,'shield')}</div>`}
function v7SidebarLink(key,title,icon,subtitle,cur){return `<button class="v7-side-link ${cur===key?'active':''}" data-action="navigate" data-value="${key}"><span class="v7-side-icon">${ic(icon,20)}</span><span><b>${esc(title)}</b><small>${esc(subtitle)}</small></span>${ic('arrow',14)}</button>`}
// Bypass V5's technical-only route remapping; restore true business workspaces.
go=function(to){if(to==='technical')state.v7TechnicalExpanded=true;return v6PrevGo(to)};
renderPage=function(cur){if(cur==='home')return v7Home();if(cur==='admin')return v7Admin();if(cur==='technical')return v7Technical();if(cur==='evaluationHub')return v7EvaluationHub();if(cur==='setup'||cur==='coverageReview'||cur==='scenarioDesigner')return v7CreatePage(cur);if(cur==='step4'||cur==='step5'||cur==='step6')return v7CreatePage(cur);if(cur==='step1')return renderStep1();if(cur==='step2')return renderCoverageReview();if(cur==='step7')return v7TaskProgress('evaluate',cur)+v6RenderStep7();if(cur==='step8')return v7TaskProgress('evaluate',cur)+v6RenderStep8();if(cur==='step9')return v7TaskProgress('evaluate',cur)+v6RenderStep9()+(selectedSession()?`<div class="v7-nextbar"><div><strong>Gate 2 complete — publish the result products</strong><small>The frozen Scenario Dataset is unchanged; Assessment and Evaluation outputs can now be published and reused.</small></div>${b('Continue to Step 10 · Publish & Reuse →','navigate','success',`data-value="step10"`)}</div>`:'');if(cur==='step10')return v7TaskProgress('evaluate',cur)+v6RenderStep10();return V7_prevPage(cur)};
function v7CurrentStage(cur){return V7_CREATE.some(x=>x[0]===cur)?'create':V7_EVALUATE.some(x=>x[0]===cur)?'evaluate':'other'}
function v7Status(n){return n===6?(frozenDataset()?'Frozen':'Gate 1'):n===9?(selectedSession()?'Evaluated':'Gate 2'):v6Done(n)?'Completed':'To do'}
renderShell=function(){const cur=state.current;const isTech=cur==='technical'||cur.startsWith('step');const stepNo=cur.startsWith('step')?Number(cur.slice(4)):0;const stage=v7CurrentStage(cur);const titleMap={home:'Platform Home',setup:'Create Simulation Dataset',coverageReview:'Coverage Plan Review',scenarioDesigner:'Scenario Design',admin:'Administration & Configuration',technical:'10-Step Technical Explorer',evaluationHub:'Run Evaluation',library:'Dataset Library',analytics:'Statistical Analytics',replay:'Historical Replay',agent:'Data Agent',knowledge:'IVT Knowledge Transfer'};
 document.title='MRO AI Risk Triaging · '+(titleMap[cur]||(stepNo?'Technical Step '+String(stepNo).padStart(2,'0'):'Platform'));
 const taskLinks=V7_TASKS.map(c=>v7SidebarLink(c.key,c.name,c.label==='SETTINGS'?'settings':c.icon,c.label==='SETTINGS'?'Questionnaire, rules and versions':c.label==='MODE A'?'Design and freeze test inputs':'Re-evaluate saved input sets',cur)).join('');
 const downstream=[['library','Dataset Library','database','Fixed inputs and published outputs'],['analytics','Statistical Analytics','chart','Distributions, missingness, sensitivity'],['replay','Historical Replay','refresh','Compare scoring methodologies'],['agent','Data Agent','bot','Natural-language analysis demo'],['knowledge','IVT Knowledge Transfer','book','Evidence-linked handover']].map(x=>v7SidebarLink(x[0],x[1],x[2],x[3],cur)).join('');
 const engineGroups=[['PREPARE & VALIDATE','01–06',0,6],['EXECUTE & EVALUATE','07–09',6,9],['PUBLISH & REUSE','10',9,10]].map(g=>`<div class="v7-side-phase"><b>${g[0]}</b><small>${g[1]}</small></div>${V7_HOW.slice(g[2],g[3]).map((x,j)=>{let n=g[2]+j+1;return `<button class="v7-side-step ${cur==='step'+n?'active':''}" data-action="navigate" data-value="step${n}"><span>${String(n).padStart(2,'0')}</span><b>${esc(x[0])}</b><small>${v6Done(n)?'✓':'·'}</small></button>`}).join('')}`).join('');
 const sidebar=`<aside class="v7-sidebar"><div class="side-brand">${ic('layers',24)}<div><h2>MRO AI Risk Triaging</h2><p>Simulation · Replay · Analytical Evaluation</p></div></div><button class="v7-side-home ${cur==='home'?'active':''}" data-action="navigate" data-value="home">${ic('layers',18)} Platform Home ${ic('arrow',15)}</button><div class="v7-side-label">START HERE · THREE USER ENTRIES</div>${taskLinks}<div class="v7-side-label">DATA & DOWNSTREAM REUSE</div>${downstream}<div class="v7-tech-toggle"><button data-action="v7-toggle-tech" aria-expanded="${state.v7TechnicalExpanded}">${ic('workflow',18)} <span><b>10-Step Engine Explorer</b><small>Technical workflow · Debug & demo</small></span><span class="v7-chevron">${state.v7TechnicalExpanded?'−':'+'}</span></button></div>${state.v7TechnicalExpanded?`<div class="v7-technical-steps"><button class="v7-technical-overview" data-action="navigate" data-value="technical">${ic('layers',16)} Overview: all 10 steps</button>${engineGroups}</div>`:''}<div class="v7-side-bottom"><b>Demo environment</b><span>Local fictional data · no live Agent, Power Apps or MARM</span></div></aside>`;
 const banner=cur==='home'?`<div class="v7-banner">${ic('info',18)} <span>This is a self-contained demonstration. Historical-style cases and scoring are fictional; all actions run locally in your browser.</span></div>`:cur==='technical'||(stepNo>0&&stepNo<=10)?`<div class="v7-banner">${ic('workflow',19)} <span><strong>Technical visibility:</strong> ${stepNo?`Step ${String(stepNo).padStart(2,'0')} · ${esc(V7_HOW[stepNo-1][0])}`:'All 10 steps'} — inspect implementation and technical controls without changing the business-user entry points.</span>${b('Home','navigate','sm',`data-value="home"`)}</div>`:`<div class="v7-banner">${ic('info',19)} <span>${stage==='create'?'Create journey: you control requirements; the system plans, matches, supplements and validates.':stage==='evaluate'?'Evaluation journey: use frozen inputs, run Agent and rules, then inspect and publish results.':cur==='admin'?'Administration is maintained independently from each user simulation.':'Results and data products are labelled demonstration outputs.'}</span>${b('Home','navigate','sm',`data-value="home"`)}</div>`;
 const technicalGuide=stepNo?`<div class="v7-tech-guide"><b>TECHNICAL STEP ${String(stepNo).padStart(2,'0')}</b><strong>${esc(V7_HOW[stepNo-1][0])}</strong><p>${esc(V7_HOW[stepNo-1][1])}</p><div class="v7-tech-guide-detail"><span><b>Output:</b> ${esc(V7_HOW[stepNo-1][2])}</span><span><b>Quality check:</b> ${esc(V7_HOW[stepNo-1][3])}</span></div></div>`:'';
 const result=renderPage(cur);
 const footer=`<footer class="v7-footer"><span>${ic('shield',16)} Demonstration only · no real classifications or live connectivity</span><div>${b('Open Engine Explorer','navigate','sm',`data-value="technical"`)}${b('Back to Home','navigate','primary sm',`data-value="home"`)}</div></footer>`;
 document.getElementById('root').innerHTML=`<header class="top"><button class="v5-mobile-toggle" data-action="v5-mobile-menu" aria-label="Toggle navigation">${ic('list',20)}</button><div class="brand"><span class="logo"><span></span><span></span><span></span></span><strong>AIASO / MRO</strong><i class="head-sep"></i><small>AI Risk Oversight & Strategy</small><i class="head-sep"></i><span class="head-title">Simulation, Replay & Analytical Evaluation</span></div><div class="top-actions">${b('Home','navigate','sm',`data-value="home"`)}<button class="head-icon" data-action="help" title="Help">${ic('info',20)}</button><button class="avatar" data-action="help">MRO</button></div></header><div class="layout v7-layout"><div class="mobile-scrim" data-action="v5-mobile-menu"></div>${sidebar}<main class="v7-main">${banner}${technicalGuide}${result}${footer}</main></div>${state.modal?renderModal():''}`;
};
action=function(name,button){if(name==='v7-toggle-tech'){state.v7TechnicalExpanded=!state.v7TechnicalExpanded;save();refresh();return}if(name==='v7-start-evaluation'){if(!state.scenarioDatasets.length){toast('Freeze a scenario dataset first.','bad');go('setup');return}save();go('step7');return}if(name==='v7-open-admin'){go('admin');return}if(name==='v7-save-admin-config'){let q=(getEl('v7-registry-version')?.value||'').trim(),m=(getEl('v7-method-version')?.value||'').trim(),thr=Number(getEl('v7-high-threshold')?.value);if(!q||!m||!Number.isFinite(thr)||thr<46||thr>100){toast('Enter both versions and a demonstration high-risk threshold between 46 and 100.','bad');return}state.registryVersion=q;state.methodologyVersion=m;state.evaluationScoreVersion=m;state.v7HighThreshold=thr;save();refresh();toast('Demo configuration saved. Existing frozen dataset snapshots are unchanged.');return}return V7_prevAction(name,button)};

renderShell();
